<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problème de paiement</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .error-box {
            background: #fee;
            border: 2px solid #fcc;
            padding: 30px;
            border-radius: 10px;
        }
        h1 { color: #c33; }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>⚠️ Problème détecté</h1>
        <p>{{ message }}</p>
        <a href="/">Retour à l'accueil</a>
    </div>
</body>
</html>
