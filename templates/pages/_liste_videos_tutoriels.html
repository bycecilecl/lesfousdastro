<ol class="beta-tutoriels-liste">
  {% for identifiant, titre in tutoriels_beta %}
  <li class="beta-tutoriel">
    <div class="beta-tutoriel-lecteur">
      <iframe src="https://www.youtube-nocookie.com/embed/{{ identifiant }}?rel=0"
        title="{{ titre }}" loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
    </div>
    <div class="beta-tutoriel-texte">
      {% if tutoriels_beta|length > 1 %}<p class="beta-tutoriel-numero">Vidéo {{ loop.index }} sur {{ tutoriels_beta|length }}</p>{% endif %}
      <h3>{{ titre }}</h3>
      <a href="https://youtu.be/{{ identifiant }}" target="_blank" rel="noopener noreferrer">Ouvrir sur YouTube ↗</a>
    </div>
  </li>
  {% endfor %}
</ol>
