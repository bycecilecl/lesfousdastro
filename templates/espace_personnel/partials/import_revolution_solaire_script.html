<script>
(() => {
    const form = document.getElementById('import-rs-form');
    if (!form) return;
    const lieu = document.getElementById('import-rs-lieu');
    const liste = document.getElementById('import-rs-suggestions');
    const latitude = document.getElementById('import-rs-lat');
    const longitude = document.getElementById('import-rs-lon');
    const fuseau = document.getElementById('import-rs-tzid');
    let resultats = [], delai, revision = 0;
    function choisirVille() {
        const ville = resultats.find(v => v.label === lieu.value);
        if (!ville) return;
        latitude.value = ville.lat;
        longitude.value = ville.lon;
        fuseau.value = ville.tzid || '';
    }
    lieu.addEventListener('input', () => {
        clearTimeout(delai);
        const version = ++revision;
        latitude.value = longitude.value = fuseau.value = '';
        lieu.setCustomValidity('');
        choisirVille();
        if (lieu.value.trim().length < 2) { liste.replaceChildren(); return; }
        delai = setTimeout(async () => {
            try {
                const reponse = await fetch('/api/geocode?q=' + encodeURIComponent(lieu.value.trim()));
                if (!reponse.ok) return;
                const donnees = await reponse.json();
                if (version !== revision) return;
                resultats = donnees.results || [];
                liste.replaceChildren(...resultats.map(ville => {
                    const option = document.createElement('option');
                    option.value = ville.label;
                    return option;
                }));
                choisirVille();
            } catch (_) { /* La ville sera vérifiée avant l'envoi du formulaire. */ }
        }, 250);
    });
    lieu.addEventListener('change', choisirVille);
    lieu.addEventListener('blur', choisirVille);
    form.addEventListener('submit', evenement => {
        choisirVille();
        if (latitude.value === '' || longitude.value === '' || !fuseau.value) {
            evenement.preventDefault();
            lieu.setCustomValidity('Choisis une ville dans les suggestions.');
            lieu.reportValidity();
            return;
        }
        const bouton = form.querySelector('button[type="submit"]');
        bouton.disabled = true;
        bouton.textContent = 'Import de ton PDF en cours…';
    });
})();
</script>
