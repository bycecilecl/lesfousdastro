<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>🚧 Maintenance — Les Fous d’Astro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --brand:#1f628e;
      --accent:#00a8a8;
      --soft:#c0f0f7;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--brand), var(--accent) 60%, var(--soft));
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #0f172a;
      text-align: center;
      padding: 32px 16px;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(31, 98, 142, 0.25);
      padding: 32px;
      max-width: 640px;
      width: 100%;
    }

    img.hero {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 24px auto;
      display: block;
      border-radius: 12px;
      animation: fadein 1.5s ease;
    }

    @keyframes fadein {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #0f172a;
    }

    p {
      color: #334155;
      font-size: 1.1rem;
      margin-bottom: 16px;
    }

    .pill {
      display: inline-block;
      background: var(--soft);
      color: #0b3550;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      .card { padding: 24px; }
      h1 { font-size: 1.5rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="{{ url_for('static', filename='images/maintenance.png') }}" alt="Maintenance Les Fous d’Astro" class="hero">
    <h1>🚧 Site en maintenance</h1>
    <p>Nous déployons une nouvelle version des analyses cosmiques 🌙</p>
    <div class="pill">Reviens dans quelques temps</div>
  </div>
</body>
</html>
