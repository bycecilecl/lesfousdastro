<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Vos retours - Les Fous d'Astro</title>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

  <style>
    .tmg-page { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .tmg-title { font-size: 2rem; font-weight: 700; margin-bottom: .25rem; }
    .tmg-sub { color: #666; margin-bottom: 1.5rem; }

    .tmg-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 14px;
    }
    @media (min-width: 640px) { .tmg-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .tmg-grid { grid-template-columns: repeat(3, 1fr); } }

    .tmg-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
      transition: transform .15s ease, box-shadow .15s ease;
      cursor: zoom-in;
    }
    .tmg-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.12); }

    .tmg-img {
      width: 100%;
      display: block;
      height: auto;
      aspect-ratio: 4/5;
      object-fit: cover;
    }

    .tmg-badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,.65); color: #fff;
      font-size: .75rem; padding: .25rem .5rem; border-radius: 999px;
    }

    .tmg-caption { padding: .75rem .9rem; font-size: .95rem; color: #333; }

    .tmg-lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      z-index: 60;
    }
    .tmg-lightbox.open { display: block; }
    .tmg-close {
      position: absolute; top: 14px; right: 14px;
      background: rgba(255,255,255,.92);
      border: none; border-radius: 999px; width: 40px; height: 40px;
      display: grid; place-items: center; font-size: 20px; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,.2);
    }

    .swiper { width: min(1000px, 92vw); height: min(82vh, 820px); margin: 8vh auto; }
    .swiper-slide {
      display: grid; place-items: center;
      background: #111; border-radius: 12px; overflow: hidden;
    }
    .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }

    .swiper-button-next, .swiper-button-prev { color: #fff; }
    .swiper-pagination-bullet { background: rgba(255,255,255,.7); }
    .swiper-pagination-bullet-active { background: #fff; }
  </style>
</head>
<body>
  <div class="tmg-page">
    <h1 class="tmg-title">Vos retours 💬</h1>
    <p class="tmg-sub">Screenshots authentiques de messages reçus. Cliquez pour agrandir et swiper.</p>

    <div class="tmg-grid" id="tmgGrid">
      {% for it in items %}
      <figure class="tmg-card" data-index="{{ loop.index0 }}">
        <span class="tmg-badge">{{ it.date }}</span>
        <img class="tmg-img" src="{{ it.src }}" alt="Témoignage : {{ it.caption }}" loading="lazy">
        <figcaption class="tmg-caption">{{ it.caption }}</figcaption>
      </figure>
      {% endfor %}
    </div>

    <div class="tmg-lightbox" id="tmgLightbox">
      <button class="tmg-close" id="tmgClose">✕</button>
      <div class="swiper" id="tmgSwiper">
        <div class="swiper-wrapper">
          {% for it in items %}
          <div class="swiper-slide">
            <img src="{{ it.src }}" alt="Témoignage : {{ it.caption }}">
          </div>
          {% endfor %}
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('#tmgSwiper', {
      loop: true,
      centeredSlides: true,
      slidesPerView: 1,
      keyboard: { enabled: true },
      pagination: { el: '.swiper-pagination', clickable: true },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
    });

    const grid = document.getElementById('tmgGrid');
    const lb = document.getElementById('tmgLightbox');
    const btnClose = document.getElementById('tmgClose');

    grid.addEventListener('click', (e) => {
      const fig = e.target.closest('.tmg-card');
      if (!fig) return;
      const index = parseInt(fig.getAttribute('data-index'), 10) || 0;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
      swiper.slideToLoop(index, 0);
    });

    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }
    btnClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  </script>
</body>
</html>
