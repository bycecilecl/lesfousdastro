<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Vos retours - Les Fous d'Astro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #fff;
    }
    .tmg-page { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }
    .tmg-title { font-size: 2rem; font-weight: 700; margin-bottom: .25rem; }
    .tmg-sub { color: #bbb; margin-bottom: 1.5rem; }

    .tmg-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 14px;
    }
    @media (min-width: 640px) { .tmg-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .tmg-grid { grid-template-columns: repeat(3, 1fr); } }

    .tmg-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      color: #111;
      box-shadow: 0 6px 18px rgba(0,0,0,.35);
      cursor: zoom-in;
    }
    .tmg-img {
      width: 100%;
      display: block;
      height: auto;
      object-fit: cover;
    }
    .tmg-badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,.7); color: #fff;
      font-size: .75rem; padding: .25rem .5rem; border-radius: 999px;
    }
    .tmg-caption { padding: .65rem .8rem; font-size: .9rem; }

    .tmg-lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.9);
      display: none;
      z-index: 9999;
    }
    .tmg-lightbox.open { display: block; }

    .tmg-close {
      position: absolute; top: 14px; right: 14px;
      background: #fff; color: #000;
      border: none; border-radius: 999px;
      width: 40px; height: 40px;
      display: grid; place-items: center;
      cursor: pointer;
    }

    .swiper { width: min(1000px, 92vw); height: min(82vh, 820px); margin: 8vh auto; }
    .swiper-slide {
      display: grid; place-items: center;
      background: #000;
    }
    .swiper-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .swiper-button-next, .swiper-button-prev { color: #fff; }
    .swiper-pagination-bullet { background: rgba(255,255,255,.7); }
    .swiper-pagination-bullet-active { background: #fff; }
  </style>
</head>
<body>
  <div class="tmg-page">
    <h1 class="tmg-title">Vos retours 💬</h1>
    <p class="tmg-sub">Screenshots authentiques de vos messages. Merci pour votre confiance.</p>
    <p class="tmg-sub">Debug : {{ items|length }} témoignages chargés.</p>

    <div class="tmg-grid" id="tmgGrid">
      {% for it in items %}
      <figure class="tmg-card" data-index="{{ loop.index0 }}">
        <span class="tmg-badge">{{ it.date }}</span>
        <img class="tmg-img" src="{{ it.src }}" alt="{{ it.caption }}" loading="lazy">
        <figcaption class="tmg-caption">{{ it.caption }}</figcaption>
      </figure>
      {% endfor %}
    </div>
  </div>

  <div class="tmg-lightbox" id="tmgLightbox">
    <button class="tmg-close" id="tmgClose">✕</button>
    <div class="swiper" id="tmgSwiper">
      <div class="swiper-wrapper">
        {% for it in items %}
        <div class="swiper-slide">
          <img src="{{ it.src }}" alt="{{ it.caption }}">
        </div>
        {% endfor %}
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('#tmgSwiper', {
      loop: true,
      centeredSlides: true,
      slidesPerView: 1,
      keyboard: { enabled: true },
      pagination: { el: '.swiper-pagination', clickable: true },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
    });

    const grid = document.getElementById('tmgGrid');
    const lb = document.getElementById('tmgLightbox');
    const btnClose = document.getElementById('tmgClose');

    grid.addEventListener('click', (e) => {
      const fig = e.target.closest('.tmg-card');
      if (!fig) return;
      const index = parseInt(fig.getAttribute('data-index'), 10) || 0;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
      swiper.slideToLoop(index, 0);
    });

    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    btnClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  </script>
</body>
</html>
