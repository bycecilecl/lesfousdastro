<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Les Fous d'Astro{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    nav {
      background: #1f628e;
      padding: 10px 20px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    nav ul li {
      margin: 0 15px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    nav ul li a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 1200px;   /* élargi */
      margin: 40px auto;
      padding: 0 20px;
    }
    footer {
      width: 100%;
      background: #f6f7fb;
      border-top: 1px solid #e5e7eb;
      padding: 20px 0;
      margin-top: 40px;
      text-align: center;
      color: #555;
      font-size: 14px;
    }
    footer .inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <nav>
    <ul class="navbar__links">
                <li><a href="{{ url_for('pages_bp.analyses') }}"
                        class="{% if request.path == url_for('pages_bp.analyses') %}active{% endif %}">Guide des Analyses</a></li>

                <li><a href="{{ url_for('pages_bp.formations') }}"
                        class="{% if request.path == url_for('pages_bp.formations') %}active{% endif %}">Formations</a></li>

                <li><a href="{{ url_for('pages_bp.ateliers') }}"
                        class="{% if request.path == url_for('pages_bp.ateliers') %}active{% endif %}">Ateliers</a></li>

                <li><a href="https://bycecilecl.com/categorie-produit/services/"
                        target="_blank" rel="noopener">Prestations</a></li>

                <li><a href="{{ url_for('pages_bp.contact') }}"
                        class="{% if request.path == url_for('pages_bp.contact') %}active{% endif %}">Contact</a></li>

                <li><a href="https://bycecilecl.com" target="_blank" rel="noopener">ByCecileCL.com</a></li>
            </ul>
  </nav>

  <main>
    {% block scripts %}{% endblock %}
  </main>

  <footer>
    <div class="inner">
      © Les Fous d’Astro — Tous droits réservés
    </div>
  </footer>

  <!-- Statcounter -->
  <script type="text/javascript">
  var sc_project=12490079; 
  var sc_invisible=1; 
  var sc_security="a231e1c7"; 
  </script>
  <script type="text/javascript"
  src="https://www.statcounter.com/counter/counter.js"
  async></script>
  <noscript><div class="statcounter"><a title="Web Analytics"
  href="https://statcounter.com/" target="_blank"><img
  class="statcounter"
  src="https://c.statcounter.com/12490079/0/a231e1c7/1/"
  alt="Web Analytics"
  referrerPolicy="no-referrer-when-downgrade"></a></div></noscript>
  <!-- End of Statcounter -->
</body>
</html>
